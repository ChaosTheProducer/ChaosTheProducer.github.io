[[items]]
title = "Undergraduate Thesis: Personalized Pricing of Customized Car Features"
subtitle = "Thesis grade: 92/100; Outstanding Thesis (top ~3%)"
date = "2026"
content = "Supervised by [Dr. Binod Bhattarai](https://sites.google.com/view/bbinod). This thesis formulated personalized pricing of customized car features as a POMDP with hidden buyer preferences, multi-round negotiation, and sequential decision-making agents. It was later refined into the arXiv preprint PrefBench, although the thesis and preprint differ in scope and presentation. [Thesis PDF](/files/Yingjie_Lei_Undergraduate_Thesis.pdf)"

[[items]]
title = "TempoPilot"
subtitle = "JC3510 Intelligent Software Implementation Course Project"
date = "2025"
content = "An open-source PyQt6 schedule management application developed for the JC3510 Intelligent Software Implementation course at SCNU-Aberdeen Institute. It supports interactive daily schedules, event editing, SQLite-backed persistence, AI-powered activity recommendations with DeepSeek, and map-based navigation. [GitHub Repository](https://github.com/ChaosTheProducer/TempoPilot)"
